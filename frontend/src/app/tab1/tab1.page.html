<ion-header [translucent]="true">
  <ion-toolbar class="profile-toolbar">
    <ion-title class="profile-toolbar-title">Profile</ion-title>
    <ion-buttons slot="end">
      <ion-button class="logout-btn" (click)="logout()">
        <ion-icon slot="start" name="log-out-outline"></ion-icon>
        Log Out
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="profile-content">
  <div class="profile-container">

    <!-- Error state -->
    <div class="profile-error-banner" *ngIf="loadError && !user">
      <ion-icon name="alert-circle-outline"></ion-icon>
      {{ loadError }}
    </div>

    <ng-container *ngIf="user">

      <!-- ── Section: Profile Info ── -->
      <div class="section-header">
        <div class="section-icon">
          <ion-icon name="person-outline"></ion-icon>
        </div>
        <div>
          <p class="section-title">Profile Info</p>
          <p class="section-desc">Update your name and email address</p>
        </div>
      </div>

      <form class="profile-card" (ngSubmit)="saveProfile()" #profileForm="ngForm">
        <div class="field-group">
          <label class="field-label">Name</label>
          <ion-input
            class="field-input"
            type="text"
            name="name"
            [(ngModel)]="name"
            placeholder="Your name"
            autocomplete="name"
          ></ion-input>
        </div>

        <div class="field-group">
          <label class="field-label">Email</label>
          <ion-input
            class="field-input"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="your@email.com"
            required
            autocomplete="email"
          ></ion-input>
        </div>

        <p class="feedback feedback--success" *ngIf="profileSuccess">
          <ion-icon name="checkmark-circle-outline"></ion-icon> {{ profileSuccess }}
        </p>
        <p class="feedback feedback--danger" *ngIf="profileError">
          <ion-icon name="alert-circle-outline"></ion-icon> {{ profileError }}
        </p>

        <button class="action-btn" type="submit" [disabled]="profileSaving || !email">
          <ion-spinner *ngIf="profileSaving" name="crescent"></ion-spinner>
          <span *ngIf="!profileSaving">Save Profile</span>
        </button>
      </form>

      <!-- ── Section: Change Password ── -->
      <div class="section-header">
        <div class="section-icon">
          <ion-icon name="lock-closed-outline"></ion-icon>
        </div>
        <div>
          <p class="section-title">Change Password</p>
          <p class="section-desc">Choose a strong password (min. 8 characters)</p>
        </div>
      </div>

      <form class="profile-card" (ngSubmit)="changePassword()" #passwordForm="ngForm">
        <div class="field-group">
          <label class="field-label">Current Password</label>
          <ion-input
            class="field-input"
            type="password"
            name="currentPassword"
            [(ngModel)]="currentPassword"
            placeholder="••••••••"
            autocomplete="current-password"
          ></ion-input>
        </div>

        <div class="field-group">
          <label class="field-label">New Password</label>
          <ion-input
            class="field-input"
            type="password"
            name="newPassword"
            [(ngModel)]="newPassword"
            placeholder="••••••••"
            autocomplete="new-password"
          ></ion-input>
        </div>

        <div class="field-group">
          <label class="field-label">Confirm New Password</label>
          <ion-input
            class="field-input"
            type="password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="••••••••"
            autocomplete="new-password"
          ></ion-input>
        </div>

        <p class="feedback feedback--success" *ngIf="passwordSuccess">
          <ion-icon name="checkmark-circle-outline"></ion-icon> {{ passwordSuccess }}
        </p>
        <p class="feedback feedback--danger" *ngIf="passwordError">
          <ion-icon name="alert-circle-outline"></ion-icon> {{ passwordError }}
        </p>

        <button
          class="action-btn"
          type="submit"
          [disabled]="passwordSaving || !currentPassword || !newPassword"
        >
          <ion-spinner *ngIf="passwordSaving" name="crescent"></ion-spinner>
          <span *ngIf="!passwordSaving">Change Password</span>
        </button>
      </form>

      <!-- ── Section: Danger Zone ── -->
      <div class="section-header">
        <div class="section-icon section-icon--danger">
          <ion-icon name="warning-outline"></ion-icon>
        </div>
        <div>
          <p class="section-title section-title--danger">Danger Zone</p>
          <p class="section-desc">Permanently delete your account and all data</p>
        </div>
      </div>

      <div class="profile-card profile-card--danger">
        <button
          class="action-btn action-btn--danger"
          type="button"
          [disabled]="deleting"
          (click)="confirmDeleteAccount()"
        >
          <ion-spinner *ngIf="deleting" name="crescent"></ion-spinner>
          <span *ngIf="!deleting">
            <ion-icon name="trash-outline"></ion-icon>
            Delete Account
          </span>
        </button>
      </div>

    </ng-container>
  </div>
</ion-content>
